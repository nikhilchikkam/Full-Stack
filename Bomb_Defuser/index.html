<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bomb Defuser Timer</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="bd.css">
</head>

<body>
    <div class="timer-container d-flex flex-column align-items-center justify-content-center">
        <input type="text" class="user-input text-center" id="defuser" placeholder="Type 'defuse' and press Enter">
        <img src="https://d1tgh8fmlzexmh.cloudfront.net/ccbp-dynamic-webapps/time-bomb-img.png" class="bomb-image">
        <p class="timer-display font-weight-bold" id="timer">10</p>
        <p id="message" class="mt-2 font-weight-bold"></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
