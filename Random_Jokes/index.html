<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Jokes</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="rj.css">
</head>

<body>
    <div class="bg-container p-3 d-flex flex-column justify-content-center text-center">
        <img src="https://d1tgh8fmlzexmh.cloudfront.net/ccbp-dynamic-webapps/random-joke-img.png" class="w-25 mx-auto" alt="Joke Image" />
        
        <p class="joke-text mt-4" id="jokeText">Click the button below to get a random joke!</p>

        <div class="d-none mt-4" id="spinner">
            <div class="d-flex justify-content-center">
                <div class="spinner-border text-light" role="status"></div>
            </div>
        </div>

        <button class="joke-button p-2 mx-auto mt-3" id="jokeBtn">Get Joke</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
