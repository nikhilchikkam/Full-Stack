<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Facts</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="nf.css">
</head>

<body>
    <div class="p-2 bg-container d-flex flex-column justify-content-center text-center">
        <h1 class="heading">Enter a number to know interesting facts about it</h1>
        <input type="number" class="form-control user-input mx-auto mt-4" placeholder="Enter a Number" id="userInput" />
        
        <div class="d-none" id="spinner">
            <div class="d-flex flex-row justify-content-center mt-4">
                <div class="spinner-border text-light" role="status"></div>
            </div>
        </div>

        <p class="fact-text mt-4" id="fact">0 is the atomic number of the theoretical element tetraneutron.</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
