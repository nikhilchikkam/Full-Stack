<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmark Manager</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="bm.css">
</head>

<body>
    <div class="banner-style p-3 text-white text-center">
        <h1>Bookmark Manager</h1>
    </div>

    <div class="container mt-4">
        <h5 class="text-center">Bookmark Your Favourite Sites</h5>
        <form id="bookmarkForm" class="mt-4 p-4 d-flex flex-column change-background">
            <label for="siteNameInput">Site Name</label>
            <input type="text" id="siteNameInput" class="form-control" placeholder="Enter site name">
            <p id="siteNameErrMsg" class="text-danger small"></p>

            <label for="siteUrlInput" class="mt-3">Site URL</label>
            <input type="text" id="siteUrlInput" class="form-control" placeholder="Enter site URL">
            <p id="siteUrlErrMsg" class="text-danger small"></p>

            <button id="submitBtn" type="submit" class="mt-3 btn btn-primary form-control">Add Bookmark</button>
        </form>

        <div class="mt-5 change-background p-3">
            <h5 class="text-center">Saved Bookmarks</h5>
            <ul id="bookmarksList" class="list-group"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
