<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Switcher</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="ts.css">
</head>

<body>
    <div id="bgContainer" class="bg-container d-flex flex-column align-items-center justify-content-center text-center p-5">
        <h1 id="heading" class="heading">Theme Switcher</h1>

        <div class="input-container mt-4">
            <input id="themeUserInput" class="form-control text-center user-input" placeholder="Type 'Light' or 'Dark'">
            <button id="themeButton" class="btn btn-primary mt-2">Switch Theme</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
