<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Code Display</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="kc.css">
</head>

<body>
    <div class="container text-center mt-5">
        <h1 class="heading">Enter a Key to Display its Key Code</h1>
        <input type="text" class="form-control mt-3 text-center" id="userInput" placeholder="Type any key..." autofocus>
        <p class="mt-3 font-weight-bold">Key Codes:</p>
        <ul class="key-code-list mt-3 list-group" id="keyCodeList"></ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
