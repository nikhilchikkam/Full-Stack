<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Moment of Peace</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="pt.css">
</head>

<body>
    <div class="timer-container d-flex flex-column align-items-center justify-content-center text-center">
        <h1 class="heading">Take A Moment of Peace</h1>
        <p class="subtext">Select a duration and relax.</p>

        <div class="btn-container">
            <button class="btn btn-primary timer-btn" id="twentySecondsBtn">20s</button>
            <button class="btn btn-primary timer-btn" id="thirtySecondsBtn">30s</button>
            <button class="btn btn-primary timer-btn" id="fortySecondsBtn">40s</button>
            <button class="btn btn-primary timer-btn" id="oneMinuteBtn">1 min</button>
        </div>

        <p class="timer-display font-weight-bold mt-4" id="timerText">Select a time to start</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
