<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Typing Test</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container mt-5 text-center">
        <h1 class="main-heading">Speed Typing Test</h1>
        <p class="main-para">Test how fast you can type!</p>

        <div class="timer-container mt-4 d-flex align-items-center justify-content-center">
            <img src="https://assets.ccbp.in/frontend/dynamic-webapps/clock-img.png" alt="Clock Icon">
            <p id="timer" class="seconds-style ml-3"><span id="seconds">0</span> Seconds</p>
        </div>

        <div class="typing-area mt-4 p-3">
            <div id="spinner" class="spinner-border text-primary d-none" role="status">
                <span class="sr-only">Loading...</span>
            </div>

            <p id="quoteDisplay" class="quote-text"></p>
            <textarea id="quoteInput" class="form-control mt-2" placeholder="Type the above quote here..."></textarea>
            
            <p id="result" class="mt-2 result-style"></p>

            <div class="mt-3">
                <button id="submitBtn" class="btn btn-success">Submit</button>
                <button id="resetBtn" class="btn btn-danger ml-3">Reset</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
