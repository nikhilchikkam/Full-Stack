<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorite Stores</title>
    <link rel="stylesheet" href="stores.css" />
</head>

<body>
    <div class="fav-str-bkg">
        <div class="fav-str-top-section d-flex flex-row justify-content-start">
            <h1 class="fav-str-heading">Shop in your favourite stores</h1>
            <img src="https://assets.ccbp.in/frontend/static-website/stores-img.png" class="fav-str-img" alt="Stores" />
        </div>
        <div class="fav-str-bottom-section">
            <h1 class="fav-str-btm-sec-heading">Select your store with one click</h1>
            <div class="fav-str-stores-container">

                <div class="fav-str-card margin-top d-flex flex-row justify-content-start">
                    <img src="https://assets.ccbp.in/frontend/static-website/amazon-logo-img.png" class="fav-str-card-img" alt="Amazon Logo" />
                    <div class="fav-str-card-content">
                        <h2 class="fav-str-card-heading">Amazon</h2>
                        <p class="fav-str-card-para">Online shopping with free shipping & cash on delivery</p>
                    </div>
                </div>

                <div class="fav-str-card margin-top d-flex flex-row justify-content-start">
                    <img src="https://assets.ccbp.in/frontend/static-website/ikea-logo-img.png" class="fav-str-card-img" alt="IKEA Logo" />
                    <div class="fav-str-card-content">
                        <h2 class="fav-str-card-heading">IKEA</h2>
                        <p class="fav-str-card-para">Explore our furniture & home furnishing range</p>
                    </div>
                </div>

                <div class="fav-str-card margin-top d-flex flex-row justify-content-start">
                    <img src="https://assets.ccbp.in/frontend/static-website/bewakoof-logo-img.png" class="fav-str-card-img" alt="Bewakoof Logo" />
                    <div class="fav-str-card-content">
                        <h2 class="fav-str-card-heading">Bewakoof</h2>
                        <p class="fav-str-card-para">Trendy clothing & accessories with great deals</p>
                    </div>
                </div>

                <div class="fav-str-card margin-top d-flex flex-row justify-content-start">
                    <img src="https://assets.ccbp.in/frontend/static-website/flipkart-logo-img.png" class="fav-str-card-img" alt="Flipkart Logo" />
                    <div class="fav-str-card-content">
                        <h2 class="fav-str-card-heading">Flipkart</h2>
                        <p class="fav-str-card-para">Discover exciting deals on electronics & more</p>
                    </div>
                </div>

            </div>
        </div>
    </div>
</body>

</html>
